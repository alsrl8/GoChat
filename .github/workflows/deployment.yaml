name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "deploy", "dev" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/go-chat-server

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Compute version
        id: vars
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/go-chat-server" | tr '[:upper:]' '[:lower:]')
          TAG=$(git rev-parse --short=8 HEAD)
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -t "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}" -t "${{ steps.vars.outputs.image }}:latest" .
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ steps.vars.outputs.image }}:latest"

  deploy-wsl:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LOCAL_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.LOCAL_PORT }}" "${{ secrets.LOCAL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to local via WSL (retry 5x, wait 5m)
        uses: nick-fields/retry@v3
        env:
          LOCAL_HOST: ${{ secrets.LOCAL_HOST }}
          LOCAL_PORT: ${{ secrets.LOCAL_PORT }}
          LOCAL_USERNAME: ${{ secrets.LOCAL_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          max_attempts: 5
          retry_wait_seconds: 300
          timeout_minutes: 20
          command: |
            ssh -i ~/.ssh/id_ed25519 -p "$LOCAL_PORT" "$LOCAL_USERNAME@$LOCAL_HOST" \
              'wsl -d Ubuntu -- bash -lc "
                set -e
                mkdir -p ~/.docker
                echo '\''{\"credsStore\":\"\"}'\'' > ~/.docker/config.json
                echo \"$GITHUB_TOKEN\" | docker login ghcr.io -u \"$GITHUB_ACTOR\" --password-stdin
                cd /opt/go-chat-server
                docker compose pull
                docker compose up -d
                docker logout ghcr.io
              "'